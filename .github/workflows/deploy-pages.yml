# main への push で検証・ビルドし、GitHub Pages に公開する。
# 事前に一度だけ: リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (static export)
        run: |
          # ユーザー/組織サイト (<name>.github.io) はルート、プロジェクトサイトは /<repo> で配信される
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then BASE=""; else BASE="/${{ github.event.repository.name }}"; fi
          NEXT_PUBLIC_BASE_PATH="$BASE" npm run build
          # _next/ ディレクトリを Jekyll に無視させない
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
