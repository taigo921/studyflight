# main への push で検証・ビルドし、GitHub Pages に公開する。
# 事前に一度だけ: リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Firestore のセキュリティルール（エミュレータで検証）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - name: Build (static export)
        # フレンド機能の Firebase 設定（リポジトリの Settings → Secrets and variables → Actions → Variables）。
        # 未設定ならフレンド機能は「準備中」と表示される
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          # ユーザー/組織サイト (<name>.github.io) はルート、プロジェクトサイトは /<repo> で配信される
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then BASE=""; else BASE="/${{ github.event.repository.name }}"; fi
          NEXT_PUBLIC_BASE_PATH="$BASE" npm run build
          # _next/ ディレクトリを Jekyll に無視させない
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
